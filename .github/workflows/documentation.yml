name: documentation

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          activate-environment: vmc_build
      - name: Install dependencies
        run: |
          conda config --add channels conda-forge
          conda install sphinx sphinx_rtd_theme doxygen "cmake>=4.0" breathe
      - name: Sphinx build
        run: |
          CONDA_BASE=$(conda info --base)
          source $CONDA_BASE/etc/profile.d/conda.sh
          conda activate
          mkdir build
          cd build
          cmake -DDOCS_ONLY:BOOL=TRUE .. 
          cmake --build . --target Doxygen -j 6 --
          cmake --build . --target Sphinx -j 6 --
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.event_name == 'push' }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/docs/sphinx/
          force_orphan: true
